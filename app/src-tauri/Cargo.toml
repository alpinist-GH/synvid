[package]
name = "synvid"
version = "0.1.0"
description = "Local AI image and video generator"
edition = "2024"
rust-version = "1.97"
autobins = false
default-run = "synvid"

[[bin]]
name = "synvid"
path = "src/main.rs"

[[example]]
name = "synvid-keychain"
path = "tools/synvid-keychain.rs"

[lib]
name = "synvid_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
rfd = "0.16"
security-framework = "3"
